---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argo-workflows
  namespace: dev
spec:
  dependsOn:
  - name: argo-workflows-ns
  targetNamespace: dev
  retryInterval: 3m
  timeout: 5m
  prune: true
  wait: true
  path: ./clusters/dev/software/argo-workflows #ingress-nginx.yaml
